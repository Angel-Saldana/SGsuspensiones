<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header-content p {
            opacity: 0.9;
        }

        .back-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: #2ecc71;
        }

        .btn-success:hover {
            background-color: #27ae60;
        }

        .btn-warning {
            background-color: #f39c12;
        }

        .btn-warning:hover {
            background-color: #d35400;
        }

        .content {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-col {
            flex: 1;
            min-width: 200px;
        }

        .product-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            margin-bottom: 10px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-image-small {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .product-image-small img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-code {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .product-stock {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .stock-low {
            color: #e74c3c;
            font-weight: 600;
        }

        .stock-ok {
            color: #2ecc71;
        }

        .product-price {
            font-weight: 600;
            color: #2c3e50;
        }

        .hidden {
            display: none;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 8px 12px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: #e9ecef;
        }

        .product-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .product-detail-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
        }

        .image-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .image-option-btn {
            flex: 1;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .image-option-btn:hover {
            background-color: #e9ecef;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .form-col {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Gestión de Inventario</h1>
                <p>Administra y busca productos del taller</p>
            </div>
            <a href="index.html" class="back-btn">← Volver al Inicio</a>
        </header>

        <div class="menu">
            <button class="btn" onclick="showSection('agregar')">Agregar Producto</button>
            <button class="btn" onclick="showSection('inventario')">Ver Inventario</button>
            <button class="btn" onclick="showSection('buscar')">Buscar Producto</button>
        </div>

        <!-- Sección Agregar Producto -->
        <div id="agregar" class="content">
            <h2>Agregar Nuevo Producto</h2>
            <form id="productForm">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="codigo">Código del Producto</label>
                            <input type="text" id="codigo" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="nombre">Nombre del Producto</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" class="form-control" required>
                                <option value="">Seleccione una categoría</option>
                                <option value="motor">Motor</option>
                                <option value="frenos">Frenos</option>
                                <option value="filtros">Filtros</option>
                                <option value="aceites">Aceites y Lubricantes</option>
                                <option value="suspension">Suspensión</option>
                                <option value="escape">Sistema de Escape</option>
                                <option value="electrico">Sistema Eléctrico</option>
                                <option value="transmision">Transmisión</option>
                                <option value="herramientas">Herramientas</option>
                                <option value="otros">Otros</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="cantidad">Cantidad</label>
                            <input type="number" id="cantidad" class="form-control" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="precioCompra">Precio de Compra</label>
                            <input type="number" id="precioCompra" class="form-control" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="precioVenta">Precio de Venta</label>
                            <input type="number" id="precioVenta" class="form-control" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="stockMinimo">Stock Mínimo</label>
                            <input type="number" id="stockMinimo" class="form-control" min="0" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="imagen">Foto del Producto</label>
                    <div class="image-options">
                        <label class="image-option-btn">
                            <input type="file" id="imagen" class="hidden" accept="image/*">
                            📁 Seleccionar archivo
                        </label>
                    </div>
                    <div class="product-image" id="imagePreview">
                        <span>Vista previa de la imagen</span>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-success" onclick="agregarProducto()">Agregar Producto</button>
                    <button type="button" class="btn" onclick="limpiarFormulario()">Limpiar Formulario</button>
                </div>
            </form>
        </div>

        <!-- Sección Inventario -->
        <div id="inventario" class="content hidden">
            <h2>Inventario Completo</h2>
            <div class="search-box">
                <input type="text" id="searchInventory" placeholder="Buscar productos..." onkeyup="filtrarInventario()">
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- Los productos se cargarán aquí dinámicamente -->
            </div>
        </div>

        <!-- Sección Buscar Producto -->
        <div id="buscar" class="content hidden">
            <h2>Buscar Producto</h2>
            <div class="form-group">
                <input type="text" id="searchTerm" class="form-control" placeholder="Ingresa código, nombre o categoría..." onkeyup="buscarProducto()">
            </div>
            <div id="searchResults">
                <!-- Los resultados de búsqueda aparecerán aquí -->
            </div>
        </div>

        <!-- Modal de Detalle de Producto 
        <div id="productDetailModal" class="product-detail-modal hidden">
            <div class="product-detail-content">
                <div class="modal-header">
                    <h3>Detalle del Producto</h3>
                    <button class="close-modal" onclick="cerrarModal()">×</button>
                </div>
                <div id="productDetailContent">
                    <!-- Contenido del detalle del producto -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Base de datos simulada
        let inventario = JSON.parse(localStorage.getItem('inventarioTaller')) || {};

        // Mostrar sección por defecto
        document.addEventListener('DOMContentLoaded', function() {
            showSection('agregar');
            actualizarVistaInventario();
            document.getElementById('imagen').addEventListener('change', previewImage);
            
            // Verificar si hay código escaneado
            const codigoEscaneado = localStorage.getItem('codigoEscaneado');
            if (codigoEscaneado) {
                document.getElementById('codigo').value = codigoEscaneado;
                localStorage.removeItem('codigoEscaneado');
            }
        });

        // Función para mostrar u ocultar secciones
        function showSection(sectionId) {
            document.querySelectorAll('.content').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
            
            if (sectionId === 'inventario') {
                actualizarVistaInventario();
            }
        }

        // Vista previa de imagen
        function previewImage() {
            const file = document.getElementById('imagen').files[0];
            const preview = document.getElementById('imagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.addEventListener('load', function() {
                    preview.innerHTML = `<img src="${reader.result}" alt="Vista previa">`;
                });
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<span>Vista previa de la imagen</span>';
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('productForm').reset();
            document.getElementById('imagePreview').innerHTML = '<span>Vista previa de la imagen</span>';
        }

        // Agregar producto al inventario
        function agregarProducto() {
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const precioCompra = parseFloat(document.getElementById('precioCompra').value);
            const precioVenta = parseFloat(document.getElementById('precioVenta').value);
            const stockMinimo = parseInt(document.getElementById('stockMinimo').value);
            const descripcion = document.getElementById('descripcion').value;
            
            // Validaciones básicas
            if (!codigo || !nombre || !categoria) {
                alert('Por favor, complete todos los campos obligatorios.');
                return;
            }
            
            if (inventario[codigo]) {
                alert('¡Ya existe un producto con este código!');
                return;
            }
            
            // Procesar imagen
            const imagenInput = document.getElementById('imagen');
            let imagenData = '';
            
            if (imagenInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenData = e.target.result;
                    guardarProducto(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData);
                };
                reader.readAsDataURL(imagenInput.files[0]);
            } else {
                guardarProducto(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData);
            }
        }
        
        function guardarProducto(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData) {
            // Agregar producto al inventario
            inventario[codigo] = {
                nombre: nombre,
                categoria: categoria,
                cantidad: cantidad,
                precioCompra: precioCompra,
                precioVenta: precioVenta,
                stockMinimo: stockMinimo,
                descripcion: descripcion,
                imagen: imagenData
            };
            
            // Guardar en localStorage
            localStorage.setItem('inventarioTaller', JSON.stringify(inventario));
            
            // Limpiar formulario
            limpiarFormulario();
            
            alert(`Producto "${nombre}" agregado exitosamente!`);
            
            // Actualizar vistas
            actualizarVistaInventario();
        }

        // Actualizar vista del inventario
        function actualizarVistaInventario() {
            const inventoryGrid = document.getElementById('inventoryGrid');
            inventoryGrid.innerHTML = '';
            
            if (Object.keys(inventario).length === 0) {
                inventoryGrid.innerHTML = '<p>No hay productos en el inventario.</p>';
                return;
            }
            
            for (const codigo in inventario) {
                const producto = inventario[codigo];
                const stockClass = producto.cantidad <= producto.stockMinimo ? 'stock-low' : 'stock-ok';
                const stockStatus = producto.cantidad <= producto.stockMinimo ? 'Stock Bajo' : 'Stock OK';
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-image-small">
                        ${producto.imagen ? `<img src="${producto.imagen}" alt="${producto.nombre}">` : '<span>Sin imagen</span>'}
                    </div>
                    <div class="product-name">${producto.nombre}</div>
                    <div class="product-code">Código: ${codigo} | ${producto.categoria}</div>
                    <div class="product-stock">
                        <span>Stock: ${producto.cantidad}</span>
                        <span class="${stockClass}">${stockStatus}</span>
                    </div>
                    <div class="product-price">Precio: $${producto.precioVenta.toFixed(2)}</div>
                `;
                productCard.onclick = () => mostrarDetalleProducto(codigo);
                inventoryGrid.appendChild(productCard);
            }
        }

        // Mostrar detalle del producto
        function mostrarDetalleProducto(codigo) {
            const producto = inventario[codigo];
            const modal = document.getElementById('productDetailModal');
            const content = document.getElementById('productDetailContent');
            
            content.innerHTML = `
                <div class="product-image" style="width: 100%; height: 200px; margin-bottom: 20px;">
                    ${producto.imagen ? `<img src="${producto.imagen}" alt="${producto.nombre}" style="width: 100%; height: 100%; object-fit: contain;">` : '<span>Sin imagen</span>'}
                </div>
                <div class="form-group">
                    <label><strong>Nombre:</strong></label>
                    <p>${producto.nombre}</p>
                </div>
                <div class="form-group">
                    <label><strong>Código:</strong></label>
                    <p>${codigo}</p>
                </div>
                <div class="form-group">
                    <label><strong>Categoría:</strong></label>
                    <p>${producto.categoria}</p>
                </div>
                <div class="form-group">
                    <label><strong>Stock:</strong></label>
                    <p>${producto.cantidad} unidades (Mínimo: ${producto.stockMinimo})</p>
                </div>
                <div class="form-group">
                    <label><strong>Precio de Compra:</strong></label>
                    <p>$${producto.precioCompra.toFixed(2)}</p>
                </div>
                <div class="form-group">
                    <label><strong>Precio de Venta:</strong></label>
                    <p>$${producto.precioVenta.toFixed(2)}</p>
                </div>
                <div class="form-group">
                    <label><strong>Descripción:</strong></label>
                    <p>${producto.descripcion || 'Sin descripción'}</p>
                </div>
                <div class="actions">
                    <button class="btn" onclick="editarProducto('${codigo}')">Editar</button>
                    <button class="btn" onclick="eliminarProducto('${codigo}')">Eliminar</button>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        // Cerrar modal
        function cerrarModal() {
            document.getElementById('productDetailModal').classList.add('hidden');
        }

        // Filtrar inventario
        function filtrarInventario() {
            const searchTerm = document.getElementById('searchInventory').value.toLowerCase();
            const productCards = document.querySelectorAll('.product-card');
            
            productCards.forEach(card => {
                const productName = card.querySelector('.product-name').textContent.toLowerCase();
                const productCode = card.querySelector('.product-code').textContent.toLowerCase();
                
                if (productName.includes(searchTerm) || productCode.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Buscar producto
        function buscarProducto() {
            const searchTerm = document.getElementById('searchTerm').value.toLowerCase();
            const searchResults = document.getElementById('searchResults');
            
            if (!searchTerm) {
                searchResults.innerHTML = '<p>Ingresa un término de búsqueda.</p>';
                return;
            }
            
            let resultados = [];
            
            for (const codigo in inventario) {
                const producto = inventario[codigo];
                
                if (codigo.toLowerCase().includes(searchTerm) || 
                    producto.nombre.toLowerCase().includes(searchTerm) || 
                    producto.categoria.toLowerCase().includes(searchTerm) ||
                    producto.descripcion.toLowerCase().includes(searchTerm)) {
                    
                    resultados.push({ codigo, ...producto });
                }
            }
            
            if (resultados.length === 0) {
                searchResults.innerHTML = '<p>No se encontraron productos.</p>';
                return;
            }
            
            let html = '<div class="inventory-grid">';
            
            resultados.forEach(producto => {
                const stockClass = producto.cantidad <= producto.stockMinimo ? 'stock-low' : 'stock-ok';
                const stockStatus = producto.cantidad <= producto.stockMinimo ? 'Stock Bajo' : 'Stock OK';
                
                html += `
                    <div class="product-card" onclick="mostrarDetalleProducto('${producto.codigo}')">
                        <div class="product-image-small">
                            ${producto.imagen ? `<img src="${producto.imagen}" alt="${producto.nombre}">` : '<span>Sin imagen</span>'}
                        </div>
                        <div class="product-name">${producto.nombre}</div>
                        <div class="product-code">Código: ${producto.codigo} | ${producto.categoria}</div>
                        <div class="product-stock">
                            <span>Stock: ${producto.cantidad}</span>
                            <span class="${stockClass}">${stockStatus}</span>
                        </div>
                        <div class="product-price">Precio: $${producto.precioVenta.toFixed(2)}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            searchResults.innerHTML = html;
        }

        // Editar producto
        function editarProducto(codigo) {
            const producto = inventario[codigo];
            
            // Llenar formulario con datos del producto
            document.getElementById('codigo').value = codigo;
            document.getElementById('codigo').readOnly = true;
            document.getElementById('nombre').value = producto.nombre;
            document.getElementById('categoria').value = producto.categoria;
            document.getElementById('cantidad').value = producto.cantidad;
            document.getElementById('precioCompra').value = producto.precioCompra;
            document.getElementById('precioVenta').value = producto.precioVenta;
            document.getElementById('stockMinimo').value = producto.stockMinimo;
            document.getElementById('descripcion').value = producto.descripcion;
            
            // Mostrar imagen si existe
            const preview = document.getElementById('imagePreview');
            if (producto.imagen) {
                preview.innerHTML = `<img src="${producto.imagen}" alt="Vista previa">`;
            }
            
            // Cambiar texto del botón
            const submitBtn = document.querySelector('#agregar .btn-success');
            submitBtn.textContent = 'Actualizar Producto';
            submitBtn.onclick = function() { actualizarProducto(codigo); };
            
            // Mostrar sección de agregar producto
            showSection('agregar');
            cerrarModal();
        }

        // Actualizar producto
        function actualizarProducto(codigo) {
            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const precioCompra = parseFloat(document.getElementById('precioCompra').value);
            const precioVenta = parseFloat(document.getElementById('precioVenta').value);
            const stockMinimo = parseInt(document.getElementById('stockMinimo').value);
            const descripcion = document.getElementById('descripcion').value;
            
            // Validaciones básicas
            if (!nombre || !categoria) {
                alert('Por favor, complete todos los campos obligatorios.');
                return;
            }
            
            // Procesar imagen
            const imagenInput = document.getElementById('imagen');
            let imagenData = inventario[codigo].imagen; // Mantener imagen actual por defecto
            
            if (imagenInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenData = e.target.result;
                    guardarActualizacion(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData);
                };
                reader.readAsDataURL(imagenInput.files[0]);
            } else {
                guardarActualizacion(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData);
            }
        }
        
        function guardarActualizacion(codigo, nombre, categoria, cantidad, precioCompra, precioVenta, stockMinimo, descripcion, imagenData) {
            // Actualizar producto
            inventario[codigo] = {
                nombre: nombre,
                categoria: categoria,
                cantidad: cantidad,
                precioCompra: precioCompra,
                precioVenta: precioVenta,
                stockMinimo: stockMinimo,
                descripcion: descripcion,
                imagen: imagenData
            };
            
            // Guardar en localStorage
            localStorage.setItem('inventarioTaller', JSON.stringify(inventario));
            
            // Restaurar formulario
            limpiarFormulario();
            document.getElementById('codigo').readOnly = false;
            
            // Restaurar botón
            const submitBtn = document.querySelector('#agregar .btn-success');
            submitBtn.textContent = 'Agregar Producto';
            submitBtn.onclick = agregarProducto;
            
            alert(`Producto "${nombre}" actualizado exitosamente!`);
            
            // Actualizar vistas
            actualizarVistaInventario();
        }

        // Eliminar producto
        function eliminarProducto(codigo) {
            if (confirm(`¿Estás seguro de que deseas eliminar el producto "${inventario[codigo].nombre}"?`)) {
                delete inventario[codigo];
                localStorage.setItem('inventarioTaller', JSON.stringify(inventario));
                
                // Actualizar vistas
                actualizarVistaInventario();
                cerrarModal();
                
                alert('Producto eliminado exitosamente.');
            }
        }
    </script>
</body>
</html>
