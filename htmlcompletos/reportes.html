<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Alertas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header-content p {
            opacity: 0.9;
        }

        .back-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .content {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .stat-card.success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .stat-card.purple {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-image-small {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .product-image-small img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-code {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .product-stock {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .stock-low {
            color: #e74c3c;
            font-weight: 600;
        }

        .stock-ok {
            color: #2ecc71;
        }

        .product-price {
            font-weight: 600;
            color: #2c3e50;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 8px 12px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: #e9ecef;
        }

        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Reportes y Alertas</h1>
                <p>Estadísticas del inventario y productos con stock bajo</p>
            </div>
            <a href="index.html" class="back-btn">← Volver al Inicio</a>
        </header>

        <div class="content">
            <h2>Estadísticas del Inventario</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalProductos">0</div>
                    <div class="stat-label">Total de Productos</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-number" id="productosStockOk">0</div>
                    <div class="stat-label">Productos con Stock OK</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-number" id="productosStockBajo">0</div>
                    <div class="stat-label">Productos con Stock Bajo</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-number" id="totalValorInventario">$0</div>
                    <div class="stat-label">Valor Total del Inventario</div>
                </div>
            </div>

            <h2>Productos con Stock Bajo</h2>
            <div id="lowStockAlerts">
                <!-- Las alertas de stock bajo aparecerán aquí -->
            </div>

            <h2>Productos Más Vendidos</h2>
            <div id="topProducts">
                <!-- Los productos más vendidos aparecerán aquí -->
            </div>
        </div>
    </div>

    <script>
        let inventario = JSON.parse(localStorage.getItem('inventarioTaller')) || {};

        // Calcular estadísticas
        function calcularEstadisticas() {
            let totalProductos = 0;
            let productosStockOk = 0;
            let productosStockBajo = 0;
            let totalValorInventario = 0;

            for (const codigo in inventario) {
                const producto = inventario[codigo];
                totalProductos++;
                totalValorInventario += producto.precioCompra * producto.cantidad;

                if (producto.cantidad <= producto.stockMinimo) {
                    productosStockBajo++;
                } else {
                    productosStockOk++;
                }
            }

            document.getElementById('totalProductos').textContent = totalProductos;
            document.getElementById('productosStockOk').textContent = productosStockOk;
            document.getElementById('productosStockBajo').textContent = productosStockBajo;
            document.getElementById('totalValorInventario').textContent = `$${totalValorInventario.toFixed(2)}`;
        }

        // Mostrar alertas de stock bajo
        function mostrarAlertasStock() {
            const lowStockAlerts = document.getElementById('lowStockAlerts');
            let productosBajoStock = [];
            
            for (const codigo in inventario) {
                const producto = inventario[codigo];
                
                if (producto.cantidad <= producto.stockMinimo) {
                    productosBajoStock.push({ codigo, ...producto });
                }
            }
            
            if (productosBajoStock.length === 0) {
                lowStockAlerts.innerHTML = '<div class="alert-warning">No hay productos con stock bajo.</div>';
                return;
            }
            
            let html = '<div class="inventory-grid">';
            
            productosBajoStock.forEach(producto => {
                html += `
                    <div class="product-card">
                        <div class="product-image-small">
                            ${producto.imagen ? `<img src="${producto.imagen}" alt="${producto.nombre}">` : '<span>Sin imagen</span>'}
                        </div>
                        <div class="product-name">${producto.nombre}</div>
                        <div class="product-code">Código: ${producto.codigo} | ${producto.categoria}</div>
                        <div class="product-stock">
                            <span>Stock: ${producto.cantidad}</span>
                            <span class="stock-low">Stock Mínimo: ${producto.stockMinimo}</span>
                        </div>
                        <div class="product-price">Precio: $${producto.precioVenta.toFixed(2)}</div>
                        <div class="actions">
                            <button class="action-btn" onclick="modificarStock('${producto.codigo}', 5)">+5</button>
                            <button class="action-btn" onclick="modificarStock('${producto.codigo}', 10)">+10</button>
                            <a href="inventario.html" class="action-btn">Editar</a>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            lowStockAlerts.innerHTML = html;
        }

        // Mostrar productos más vendidos (simulado)
        function mostrarProductosMasVendidos() {
            const topProducts = document.getElementById('topProducts');
            
            // En una implementación real, esto vendría de un historial de ventas
            let productos = [];
            for (const codigo in inventario) {
                productos.push({ codigo, ...inventario[codigo] });
            }
            
            // Ordenar por cantidad (simulando productos más vendidos)
            productos.sort((a, b) => b.cantidad - a.cantidad);
            
            let html = '<div class="inventory-grid">';
            
            productos.slice(0, 6).forEach(producto => {
                html += `
                    <div class="product-card">
                        <div class="product-image-small">
                            ${producto.imagen ? `<img src="${producto.imagen}" alt="${producto.nombre}">` : '<span>Sin imagen</span>'}
                        </div>
                        <div class="product-name">${producto.nombre}</div>
                        <div class="product-code">Código: ${producto.codigo}</div>
                        <div class="product-stock">
                            <span>Stock: ${producto.cantidad}</span>
                        </div>
                        <div class="product-price">Precio: $${producto.precioVenta.toFixed(2)}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            topProducts.innerHTML = html;
        }

        // Modificar stock
        function modificarStock(codigo, cantidad) {
            if (inventario[codigo]) {
                inventario[codigo].cantidad += cantidad;
                localStorage.setItem('inventarioTaller', JSON.stringify(inventario));
                
                // Actualizar vistas
                calcularEstadisticas();
                mostrarAlertasStock();
                mostrarProductosMasVendidos();
            }
        }

        // Inicializar reportes
        document.addEventListener('DOMContentLoaded', function() {
            calcularEstadisticas();
            mostrarAlertasStock();
            mostrarProductosMasVendidos();
        });
    </script>
</body>
</html>
